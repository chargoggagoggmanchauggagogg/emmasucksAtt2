<div class="w-full max-w-md flex flex-col items-center space-y-6 mx-4">
  <!-- LOG IN BADGE ICON OVERRIDE (SWAPPED TO MATRIX GREEN) -->
  <div class="w-14 h-14 bg-[#10b981] rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-500/10">
    <svg class="w-6 h-6 text-zinc-950" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
    </svg>
  </div>

  <div class="text-center space-y-1">
    <h1 class="text-3xl font-bold tracking-tight text-white">Welcome back</h1>
    <p class="text-sm text-zinc-400">Log in to your account</p>
  </div>

  <!-- CONTAINER FRAME -->
  <div class="w-full bg-[#09090b] border border-zinc-800/80 rounded-2xl p-6 shadow-2xl flex flex-col space-y-5">
    <!-- GOOGLE INTEGRATION SECTION -->
    <button onclick="handleGoogleOAuth()" class="w-full flex items-center justify-center space-x-3 bg-transparent border border-zinc-800 hover:border-zinc-700 hover:bg-zinc-900/50 transition py-3 rounded-xl text-sm font-medium text-zinc-200">
      <svg class="w-4 h-4" viewBox="0 0 24 24">
        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
      </svg>
      <span>Continue with Google</span>
    </button>

    <div class="relative flex py-1 items-center">
      <div class="flex-grow border-t border-zinc-800/40"></div>
      <span class="flex-shrink mx-4 text-xs font-semibold text-zinc-600 uppercase tracking-widest">or</span>
      <div class="flex-grow border-t border-zinc-800/40"></div>
    </div>

    <!-- MAIN ACCESS FORMS CORE -->
    <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-semibold text-zinc-300 mb-2">Email</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-zinc-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 002-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
          </span>
          <input type="text" id="auth-email" placeholder="you@example.com" class="w-full bg-transparent border border-zinc-800 focus:border-emerald-500 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none transition placeholder-zinc-700 text-zinc-200" required>
        </div>
      </div>

      <div>
        <div class="flex justify-between items-baseline mb-2">
          <label class="block text-sm font-semibold text-zinc-300">Password</label>
          <button type="button" class="text-xs font-medium text-blue-400 hover:underline">Forgot password?</button>
        </div>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-zinc-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
          </span>
          <input type="password" id="auth-password" placeholder="••••••••" class="w-full bg-transparent border border-zinc-800 focus:border-blue-500 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none transition placeholder-zinc-700 text-zinc-200" required>
        </div>
      </div>

      <!-- MATRIX THEMED SUBMIT BUTTON -->
      <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-blue-600 hover:from-emerald-500 hover:to-blue-500 transition py-3 rounded-xl text-sm font-bold text-white tracking-wide mt-2 shadow-lg shadow-emerald-950/20">Log in</button>
    </form>

    <div class="pt-2">
      <button onclick="handleGuestLogin()" class="w-full flex items-center justify-center space-x-2 bg-transparent text-emerald-400 hover:text-emerald-300 transition py-1 rounded-xl text-sm font-medium">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
        <span>Continue as guest</span>
      </button>
    </div>
  </div>

  <div class="text-center text-sm text-zinc-500">
    <span>Don't have an account?</span>
    <button class="text-emerald-400 font-semibold ml-1 hover:underline">Create one</button>
  </div>
</div>
