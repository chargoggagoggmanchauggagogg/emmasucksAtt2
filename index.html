<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>emmasucks | Chat</title>
  <!-- Tailwind CSS Engine -->
  <script src="https://tailwindcss.com"></script>
  <!-- Font Styles -->
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    /* Beautiful Custom Scrollbars */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 h-screen overflow-hidden flex flex-col">

  <!-- TOP HEADER PANEL -->
  <header class="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex items-center justify-between shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-purple-600 flex items-center justify-between justify-center font-bold text-white shadow-md shadow-purple-500/20">E</div>
      <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">emmasucks</h1>
    </div>
    <div class="flex items-center space-x-6">
      <!-- DYNAMIC COIN DISPLAY -->
      <div class="flex items-center space-x-2 bg-purple-950/40 border border-purple-800/60 px-3 py-1.5 rounded-full shadow-inner shadow-purple-900/30">
        <span class="text-amber-400 font-bold text-sm">🪙</span>
        <span id="coin-count" class="font-bold text-purple-200 text-sm tracking-wide">3015</span>
      </div>
      <div class="flex items-center space-x-2">
        <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
        <span id="user-display" class="text-sm font-medium text-zinc-400">Admin</span>
      </div>
    </div>
  </header>

  <!-- MAIN DASHBOARD CONTENT GRID -->
  <div class="flex flex-1 overflow-hidden">
    
    <!-- LEFT SIDEBAR: LOBBY LIST -->
    <aside class="w-80 bg-zinc-900/50 border-r border-zinc-800/80 p-4 flex flex-col space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Chat Lobbies</h2>
        <button onclick="createNewLobby()" class="text-xs font-bold text-purple-400 hover:text-purple-300 transition flex items-center space-x-1 bg-purple-950/30 border border-purple-900/50 px-2 py-1 rounded-md">
          <span>+ New Chat</span>
        </button>
      </div>
      
      <!-- LOBBIES STREAM CONTAINER -->
      <nav id="lobby-container" class="flex-1 overflow-y-auto space-y-1 pr-1">
        <!-- Pre-populated rooms -->
        <button onclick="switchRoom('stellalovesgraves')" id="btn-stellalovesgraves" class="w-full text-left p-3 rounded-xl bg-purple-600/10 border border-purple-500/20 text-purple-200 font-medium transition flex flex-col space-y-1 shadow-md shadow-purple-950/20">
          <span class="text-sm font-bold"># stellalovesgraves</span>
          <span class="text-xs text-purple-400/80 font-normal truncate">if Phillip graves is lost please return to stella</span>
        </button>
        <button onclick="switchRoom('testchatformods')" id="btn-testchatformods" class="w-full text-left p-3 rounded-xl hover:bg-zinc-800/50 border border-transparent hover:border-zinc-800 text-zinc-400 hover:text-zinc-200 font-medium transition flex flex-col space-y-1">
          <span class="text-sm font-bold"># TestChatForMods</span>
          <span class="text-xs text-zinc-500 truncate">*vsauce music plays*</span>
        </button>
        <button onclick="switchRoom('liamdoesntlikekatie')" id="btn-liamdoesntlikekatie" class="w-full text-left p-3 rounded-xl hover:bg-zinc-800/50 border border-transparent hover:border-zinc-800 text-zinc-400 hover:text-zinc-200 font-medium transition flex flex-col space-y-1">
          <span class="text-sm font-bold"># LiamDoesn'tLikeKatieOrDoesHe?</span>
          <span class="text-xs text-zinc-500 truncate">the chats my friends made</span>
        </button>
      </nav>
    </aside>

    <!-- RIGHT MAIN PANEL: ACTIVE CHAT SCREEN -->
    <main class="flex-1 flex flex-col bg-zinc-950">
      <!-- ACTIVE ROOM HEADER -->
      <div class="px-6 py-4 bg-zinc-900/20 border-b border-zinc-900 flex items-center justify-between">
        <div>
          <h3 id="active-room-title" class="font-bold text-lg text-zinc-100"># stellalovesgraves</h3>
          <p id="active-room-desc" class="text-xs text-zinc-400 mt-0.5">if Phillip graves is lost please return to stella</p>
        </div>
      </div>

      <!-- MESSAGES WINDOW SCROLL -->
      <div id="messages-window" class="flex-1 overflow-y-auto p-6 space-y-4">
        <!-- Messages will render automatically via loop -->
      </div>

      <!-- BOTTOM TEXT INPUT AREA -->
      <footer class="p-4 bg-zinc-900/30 border-t border-zinc-900">
        <form id="message-form" onsubmit="sendMessage(event)" class="flex space-x-3 max-w-5xl mx-auto items-center">
          <input type="text" id="message-input" autocomplete="off" placeholder="Message active lobby..." class="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-purple-500/80 transition shadow-inner placeholder-zinc-500 text-zinc-200">
          <button type="submit" class="bg-purple-600 hover:bg-purple-500 active:bg-purple-700 transition px-5 py-3 rounded-xl text-sm font-bold text-white shadow-md shadow-purple-900/20 tracking-wide">Send</button>
        </form>
      </footer>
    </aside>

  </div>

  <!-- APPLICATION DATA INTERACTIVE CONTROL RULES -->
  <script>
    let currentRoom = "stellalovesgraves";

    // 1. FETCH AND LOAD MESSAGES STREAM
    async function loadData() {
      try {
        const response = await fetch('/api/messages');
        const data = await response.json();
        
        // Filter messages belonging strictly to the open room channel
        const filtered = data.filter(m => m.room === currentRoom);
        const window = document.getElementById('messages-window');
        window.innerHTML = '';
        
        filtered.forEach(msg => {
          const div = document.createElement('div');
          div.className = "flex flex-col space-y-1 max-w-3xl animate-[fadeIn_0.2s_ease-out]";
          div.innerHTML = `
            <div class="flex items-baseline space-x-2">
              <span class="text-sm font-bold tracking-wide text-purple-400">${msg.sender}</span>
              <span class="text-[10px] text-zinc-500 font-medium">${new Date(msg.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
            </div>
            <div class="bg-zinc-900/80 border border-zinc-800/50 px-4 py-2.5 rounded-2xl rounded-tl-none inline-block text-sm text-zinc-200 shadow-sm leading-relaxed">${msg.text}</div>
          `;
          window.appendChild(div);
        });
        window.scrollTop = window.scrollHeight; // Auto snap scroll to bottom
      } catch (err) {
        console.error("Data load failure:", err);
      }
    }

    // 2. SUBMIT MESSAGE HANDLER
    async function sendMessage(event) {
      event.preventDefault();
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      try {
        await fetch('/api/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sender: 'Admin', text: text, room: currentRoom })
        });
        input.value = '';
        loadData(); // Re-index stream immediately
      } catch (err) {
        console.error("Transmission crash:", err);
      }
    }

    // 3. SWITCH ROOM CHANNELS HANDLER
    function switchRoom(roomId) {
      // Clear active styling from previous selection buttons
      document.querySelectorAll('#lobby-container button').forEach(btn => {
        btn.className = "w-full text-left p-3 rounded-xl hover:bg-zinc-800/50 border border-transparent hover:border-zinc-800 text-zinc-400 hover:text-zinc-200 font-medium transition flex flex-col space-y-1";
      });
      
      // Target elements updates
      const targetBtn = document.getElementById(`btn-${roomId}`);
      if (targetBtn) {
        targetBtn.className = "w-full text-left p-3 rounded-xl bg-purple-600/10 border border-purple-500/20 text-purple-200 font-medium transition flex flex-col space-y-1 shadow-md shadow-purple-950/20";
      }

      const title = targetBtn.querySelector('.font-bold').innerText;
      const desc = targetBtn.querySelector('.truncate').innerText;
      
      document.getElementById('active-room-title').innerText = title;
      document.getElementById('active-room-desc').innerText = desc;
      
      currentRoom = roomId;
      loadData();
    }

    // 4. CREATE INFINITE NEW CHATS LOOP BUILDER
    function createNewLobby() {
      const name = prompt("Enter new chat lobby name:");
      if (!name) return;
      const desc = prompt("Enter lobby description:") || "A fresh custom lounge channel.";
      const cleanId = name.toLowerCase().replace(/[^a-z0-9]/g, '');

      const container = document.getElementById('lobby-container');
      const btn = document.createElement('button');
      btn.id = `btn-${cleanId}`;
      btn.onclick = () => switchRoom(cleanId);
      btn.className = "w-full text-left p-3 rounded-xl hover:bg-zinc-800/50 border border-transparent hover:border-zinc-800 text-zinc-400 hover:text-zinc-200 font-medium transition flex flex-col space-y-1";
      btn.innerHTML = `<span class="text-sm font-bold"># ${name}</span><span class="text-xs text-zinc-500 truncate">${desc}</span>`;
      
      container.appendChild(btn);
      switchRoom(cleanId);
    }

    // Polling interval loop to check for new database records continuously every 2 seconds
    setInterval(loadData, 2000);
    window.onload = loadData;
  </script>
</body>
</html>
