<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>emmasucks | Network</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>body{font-family:'Plus Jakarta Sans',sans-serif;background-color:#09090b;}</style>
</head>
<body class="text-zinc-100 h-screen overflow-hidden flex flex-col items-center justify-center">

  <div id="app-view" class="w-full h-screen flex flex-col items-center justify-center">
    
    <div id="login-interface" class="w-full max-w-md flex flex-col items-center space-y-6 mx-4">
      <div class="w-14 h-14 bg-emerald-500 rounded-2xl flex items-center justify-center shadow-lg shadow-emerald-500/10">
        <svg class="w-6 h-6 text-zinc-950" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
        </svg>
      </div>
      <div class="text-center space-y-1">
        <h1 class="text-3xl font-bold tracking-tight text-white">Welcome back</h1>
        <p class="text-sm text-zinc-400">Log in to your account</p>
      </div>
      <div class="w-full bg-[#121214] border border-zinc-800/80 rounded-2xl p-6 shadow-2xl flex flex-col space-y-5">
        <button onclick="bypassAuth('GoogleUser')" class="w-full flex items-center justify-center space-x-3 bg-transparent border border-zinc-800 hover:bg-zinc-900 transition py-3 rounded-xl text-sm font-medium text-zinc-200">
          <svg class="w-4 h-4" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/></svg>
          <span>Continue with Google</span>
        </button>
        <div class="relative flex py-1 items-center"><div class="flex-grow border-t border-zinc-800/40"></div><span class="flex-shrink mx-4 text-xs font-semibold text-zinc-600 uppercase tracking-widest">or</span><div class="flex-grow border-t border-zinc-800/40"></div></div>
        <form onsubmit="handleAuth(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-zinc-300 mb-2">Email or Username</label>
            <input type="text" id="auth-email" placeholder="you@example.com" class="w-full bg-transparent border border-zinc-800 focus:border-emerald-500 rounded-xl px-4 py-3 text-sm focus:outline-none transition placeholder-zinc-700 text-zinc-200" required>
          </div>
          <div>
            <div class="flex justify-between items-baseline mb-2"><label class="block text-sm font-semibold text-zinc-300">Password</label><button type="button" class="text-xs font-medium text-blue-400 hover:underline">Forgot password?</button></div>
            <input type="password" id="auth-password" placeholder="••••••••" class="w-full bg-transparent border border-zinc-800 focus:border-blue-500 rounded-xl px-4 py-3 text-sm focus:outline-none transition placeholder-zinc-700 text-zinc-200" required>
          </div>
          <button type="submit" class="w-full bg-gradient-to-r from-emerald-600 to-blue-600 hover:from-emerald-500 hover:to-blue-500 transition py-3 rounded-xl text-sm font-bold text-white tracking-wide mt-2 shadow-lg">Log in</button>
        </form>
        <div class="pt-2"><button onclick="bypassAuth('GuestUser')" class="w-full flex items-center justify-center space-x-2 bg-transparent text-emerald-400 hover:text-emerald-300 transition py-1 rounded-xl text-sm font-medium"><span>Continue as guest</span></button></div>
      </div>
      <div class="text-center text-sm text-zinc-500"><span>Don't have an account?</span><button onclick="toggleAuthScreens('signup')" class="text-emerald-400 font-semibold ml-1 hover:underline">Create one</button></div>
    </div>

    <div id="signup-interface" class="hidden w-full max-w-md flex flex-col items-center space-y-6 mx-4">
      <div class="w-14 h-14 bg-blue-500 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/10">
        <svg class="w-6 h-6 text-zinc-950" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
        </svg>
      </div>
      <div class="text-center space-y-1">
        <h1 class="text-3xl font-bold tracking-tight text-white">Create account</h1>
        <p class="text-sm text-zinc-400">Join the chat community today</p>
      </div>
      <div class="w-full bg-[#121214] border border-zinc-800/80 rounded-2xl p-6 shadow-2xl flex flex-col space-y-5">
        <form onsubmit="handleSignup(event)" class="space-y-4">
          <div>
            <label class="block text-sm font-semibold text-zinc-300 mb-2">Username</label>
            <input type="text" id="signup-username" placeholder="Choose a username" class="w-full bg-transparent border border-zinc-800 focus:border-blue-500 rounded-xl px-4 py-3 text-sm focus:outline-none transition placeholder-zinc-700 text-zinc-200" required>
          </div>
          <div>
            <label class="block text-sm font-semibold text-zinc-300 mb-2">Email Address</label>
            <input type="email" id="signup-email" placeholder="you@example.com" class="w-full bg-transparent border border-zinc-800 focus:border-blue-500 rounded-xl px-4 py-3 text-sm focus:outline-none transition placeholder-zinc-700 text-zinc-200" required>
          </div>
          <div>
            <label class="block text-sm font-semibold text-zinc-300 mb-2">Password</label>
            <input type="password" id="signup-password" placeholder="••••••••" class="w-full bg-transparent border border-zinc-800 focus:border-blue-500 rounded-xl px-4 py-3 text-sm focus:outline-none transition placeholder-zinc-700 text-zinc-200" required>
          </div>
          <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-emerald-600 hover:from-blue-500 hover:to-emerald-500 transition py-3 rounded-xl text-sm font-bold text-white tracking-wide mt-2 shadow-lg">Sign up</button>
        </form>
      </div>
      <div class="text-center text-sm text-zinc-500"><span>Already have an account?</span><button onclick="toggleAuthScreens('login')" class="text-emerald-400 font-semibold ml-1 hover:underline">Log in</button></div>
    </div>

    <div id="dashboard-interface" class="hidden w-full h-screen overflow-hidden flex flex-col">
      <header class="bg-zinc-900 border-b border-zinc-800 px-6 py-4 flex items-center justify-between shadow-lg">
        <div class="flex items-center space-x-3"><div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-emerald-600 to-blue-600 flex items-center justify-center font-bold text-white shadow-md">E</div><h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-emerald-400 to-blue-400 bg-clip-text text-transparent">emmasucks</h1></div>
        <div class="flex items-center space-x-6">
          <div class="flex items-center space-x-2 bg-emerald-950/40 border border-emerald-800/60 px-3 py-1.5 rounded-full"><span class="text-amber-400 font-bold text-sm">🪙</span><span id="coin-count" class="font-bold text-emerald-200 text-sm tracking-wide">3015</span></div>
          <div class="flex items-center space-x-2"><div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div><span id="user-display" class="text-sm font-medium text-zinc-400">Admin</span></div>
        </div>
      </header>
      <div class="flex flex-1 overflow-hidden">
        <aside class="w-80 bg-zinc-900/40 border-r border-zinc-800 p-4 flex flex-col space-y-4">
          <div class="flex items-center justify-between"><h2 class="text-xs font-semibold text-zinc-500 uppercase tracking-wider">Chat Lobbies</h2><button onclick="createRoom()" class="text-xs font-bold text-emerald-400 hover:text-emerald-300 transition flex items-center space-x-1 bg-emerald-950/30 border border-emerald-900/50 px-2 py-1 rounded-md"><span>+ New Chat</span></button></div>
          <nav id="lobby-container" class="flex-1 overflow-y-auto space-y-1 pr-1">
            <button onclick="switchRoom('stellalovesgraves')" id="btn-stellalovesgraves" class="w-full text-left p-3 rounded-xl bg-emerald-600/10 border border-emerald-500/20 text-emerald-200 font-medium transition flex flex-col space-y-1"><span class="text-sm font-bold"># stellalovesgraves</span><span class="text-xs text-emerald-400/80 font-normal truncate">if Phillip graves is lost please return to stella</span></button>
            <button onclick="switchRoom('testchatformods')" id="btn-testchatformods" class="w-full text-left p-3 rounded-xl hover:bg-zinc-800/50 border border-transparent hover:border-zinc-800 text-zinc-400 hover:text-zinc-200 font-medium transition flex flex-col space-y-1"><span class="text-sm font-bold"># TestChatForMods</span><span class="text-xs text-zinc-500 truncate">*vsauce music plays*</span></button>
          </nav>
        </aside>
        <main class="flex-1 flex flex-col bg-zinc-950">
          <div class="px-6 py-4 bg-zinc-900/20 border-b border-zinc-900 flex items-center justify-between"><div><h3 id="room-title" class="font-bold text-lg text-zinc-100"># stellalovesgraves</h3><p id="room-desc" class="text-xs text-emerald-400 mt-0.5">if Phillip graves is lost please return to stella</p></div></div>
          <div id="messages-window" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
          <footer class="p-4 bg-zinc-900/30 border-t border-zinc-900"><form onsubmit="sendMessage(event)" class="flex space-x-3 max-w-5xl mx-auto items-center"><input type="text" id="msg-input" autocomplete="off" placeholder="Message active lobby..." class="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-zinc-200"><button type="submit" class="bg-gradient-to-r from-emerald-600 to-blue-600 hover:from-emerald-500 hover:to-blue-500 transition px-5 py-3 rounded-xl text-sm font-bold text-white shadow-md">Send</button></form></footer>
        </main>
      </div>
    </div>
  </div>

  <script>
    let activeUser = "Admin", activeRoom = "stellalovesgraves";

    // NEW FUNCTION: Switch layout displays between login and signup
    function toggleAuthScreens(screen) {
      if (screen === 'signup') {
        document.getElementById('login-interface').classList.add('hidden');
        document.getElementById('signup-interface').classList.remove('hidden');
      } else {
        document.getElementById('signup-interface').classList.add('hidden');
        document.getElementById('login-interface').classList.remove('hidden');
      }
    }

    // NEW FUNCTION: Handle form action for signup
    function handleSignup(e) {
      e.preventDefault();
      const username = document.getElementById('signup-username').value.trim();
      activeUser = username;
      document.getElementById('signup-interface').classList.add('hidden');
      launchDashboard();
    }

    function handleAuth(e) {
      e.preventDefault();
      const input = document.getElementById('auth-email').value.trim();
      activeUser = input.includes('@') ? input.split('@')[0] : input;
      launchDashboard();
    }

    function bypassAuth(type) {
      activeUser = type === "GoogleUser" ? "GoogleUser" : "Guest_" + Math.floor(Math.random()*900+100);
      if(type !== "GoogleUser") document.getElementById('coin-count').innerText = "0";
      launchDashboard();
    }

    function launchDashboard() {
      document.getElementById('user-display').innerText = activeUser;
      document.getElementById('login-interface').style.display = "none";
      const view = document.getElementById('app-view');
      view.className = "w-full h-screen flex flex-col";
      document.getElementById('dashboard-interface').classList.remove('hidden');
      loadMessages();
    }

    async function loadMessages() {
      if (document.getElementById('dashboard-interface').classList.contains('hidden')) return;
      try {
        const res = await fetch('/api/messages');
        const data = await res.json();
        const filtered = data.filter(m => m.room === activeRoom);
        const win = document.getElementById('messages-window');
        win.innerHTML = '';
        filtered.forEach(msg => {
          const div = document.createElement('div'); div.className = "flex flex-col space-y-1 max-w-3xl mb-3";
          div.innerHTML = `<div class="flex items-baseline space-x-2"><span class="text-sm font-bold text-emerald-400">${msg.sender}</span><span class="text-[10px] text-zinc-500">${new Date(msg.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</span></div><div class="bg-zinc-900 border border-zinc-800 px-4 py-2.5 rounded-2xl rounded-tl-none text-sm shadow-sm">${msg.text}</div>`;
          win.appendChild(div);
        });
        win.scrollTop = win.scrollHeight;
      } catch (err) { console.error("Sync log crash:", err); }
    }

    async function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;
      try {
        await fetch('/api/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ sender: activeUser, text: text, room: activeRoom }) });
        input.value = '';
        loadMessages();
      } catch (err) { console.error("Send crash:", err); }
    }

    function switchRoom(roomId) {
      document.querySelectorAll('#lobby-container button').forEach(btn => btn.className = "w-full text-left p-3 rounded-xl hover:bg-zinc-800/50 border border-transparent hover:border-zinc-800 text-zinc-400 hover:text-zinc-200 transition flex flex-col space-y-1");
      const target = document.getElementById(`btn-${roomId}`);
      if (target) target.className = "w-full text-left p-3 rounded-xl bg-emerald-600/10 border border-emerald-500/20 text-emerald-200 transition flex flex-col space-y-1 shadow-md";
      document.getElementById('room-title').innerText = target.querySelector('.font-bold').innerText;
      document.getElementById('room-desc').innerText = target.querySelector('.truncate').innerText;
      activeRoom = roomId;
      loadMessages();
    }

    function createRoom() {
      const name = prompt("Enter new chat lobby name:"); if (!name) return;
      const desc = prompt("Enter lobby description:") || "Custom lounge.";
      const cleanId = name.toLowerCase().replace(/[^a-z0-9]/g, '');
      const btn = document.createElement('button'); btn.id = `btn-${cleanId}`; btn.onclick = () => switchRoom(cleanId);
      btn.className = "w-full text-left p-3 rounded-xl hover:bg-zinc-800/50 border border-transparent hover:border-zinc-800 text-zinc-400 hover:text-zinc-200 transition flex flex-col space-y-1";
      btn.innerHTML = `<span class="text-sm font-bold"># ${name}</span><span class="text-xs text-zinc-500 truncate">${desc}</span>`;
      document.getElementById('lobby-container').appendChild(btn);
      switchRoom(cleanId);
    }

    setInterval(loadMessages, 2000);
  </script>
</body>
</html>
